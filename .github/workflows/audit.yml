name: Audit

# S148：把"明文/历史明文/依赖/上帝文件/审计时效/覆盖率"六类审核本地化后的 CI 镜像。
# local_audit.py 是合入前本机快门（make audit-fast / pre-commit / pre-push）；
# 本 workflow 是它在 CI 上的备份——确保合入 main-v2 的每一笔都过同样门。
# vet/repolint/golangci 已由 ci.yml 的 lint-code/root/lint job 覆盖，此处不重复。

on:
  push:
    branches: [main-v2]
  pull_request:
    branches: [main-v2]

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 50        # history 门要近 50 提交的 diff 面

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: local audit gates (secrets/history/deps/godfiles/freshness)
        run: |
          python3 scripts/local_audit.py --only secrets,history,deps,godfiles,freshness

  coverage-gate:
    if: github.event_name != 'pull_request'   # 覆盖率是趋势门：只在 main-v2 push 判
    runs-on: ubuntu-latest
    needs: audit-gates
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: test with coverage
        run: go test -coverprofile=coverage.out -covermode=atomic ./...

      - name: coverage threshold gate
        run: |
          python3 scripts/local_audit.py --only coverage